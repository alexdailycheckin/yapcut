<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YapCut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="__FONT_LINK__">
<style>
__STYLE__
</style>
</head>
<body>

<div class="band">
  <div class="inner">
    <nav class="nav" aria-label="Page">
      <div class="brand">__LOGOMINI__<div class="wm"><b>YapCut</b>__BYLINE__</div></div>
      <div class="tabs" role="tablist" aria-label="View">
        <button type="button" role="tab" id="tab-film" aria-selected="true" aria-controls="p-film">Film</button>
        <button type="button" role="tab" id="tab-post" aria-selected="false" aria-controls="p-post">Post</button>
        <button type="button" role="tab" id="tab-results" aria-selected="false" aria-controls="p-results">Results</button>
      </div>
      <div class="actions">__PARTNER__<button class="btn ghost" id="exportBtn" type="button">Export</button><button class="btn ghost" id="theme" type="button" aria-pressed="false">Dark mode</button></div>
    </nav>
    <div class="welcome">
      <div class="hello">
        __AVATAR__
        <h1>__HELLO__ <span id="hello2">Pick a lane and start filming.</span></h1>
      </div>
      <div class="period">
        <span class="range" id="range"></span>
        <div class="seg" role="group" aria-label="Week" id="weekSeg"></div>
        <select class="older" id="olderSel" aria-label="Older weeks" hidden></select>
      </div>
    </div>
  </div>
</div>

<main class="inner">
  <div class="panel-tab" id="p-film" role="tabpanel" aria-labelledby="tab-film"></div>
  <div class="panel-tab" id="p-post" role="tabpanel" aria-labelledby="tab-post" hidden></div>
  <div class="panel-tab" id="p-results" role="tabpanel" aria-labelledby="tab-results" hidden></div>
</main>

<footer class="inner" id="foot"></footer>
<div class="drawer-bg" id="dbg" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail" hidden></aside>
<div class="film" id="film" role="dialog" aria-modal="true" aria-label="Film mode" hidden></div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="application/json" id="weeks-data">__WEEKS_JSON__</script>
<script type="application/json" id="campaigns-data">__CAMPAIGNS_JSON__</script>
<script type="application/json" id="tracking-seed">__TRACKING_JSON__</script>
<script type="application/json" id="perf-data">__PERF_JSON__</script>
<script type="application/json" id="ui-config">__UI_JSON__</script>
<script>
__SCRIPT__
</script>
</body>
</html>
